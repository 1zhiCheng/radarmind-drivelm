name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q reproduction scripts challenge
      - name: Test deterministic DriveLM-DS metrics
        run: |
          python -m pip install pytest
          python -m pytest -q reproduction/drivelm_ds_eval/test_metrics.py
